<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 852" width="540" height="852">
  <defs>
    <linearGradient id="token-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a10"/>
      <stop offset="100%" stop-color="#0e111a"/>
    </linearGradient>
    <linearGradient id="token-indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f6bff"/>
      <stop offset="100%" stop-color="#3b52d9"/>
    </linearGradient>
  </defs>

  <rect width="540" height="852" fill="url(#token-bg)" rx="24"/>

  <!-- Title Header -->
  <g transform="translate(30, 40)">
    <text x="0" y="20" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="22" fill="#ffffff">Design Tokens &amp; Component Library</text>
    <text x="0" y="42" font-family="'Geist Mono', monospace" font-size="12" fill="#4f6bff">PENPOT NATIVE ASSETS • APEX STUDIO v2.0</text>
  </g>

  <!-- 1. Color Palette Swatches -->
  <g transform="translate(30, 110)">
    <text x="0" y="0" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">SURFACE &amp; BACKGROUND SYSTEM</text>

    <!-- Canvas Base -->
    <g transform="translate(0, 16)">
      <rect width="110" height="60" rx="10" fill="#090a10" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="10" y="24" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Canvas Base</text>
      <text x="10" y="44" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">#090A10</text>
    </g>

    <!-- Surface Main -->
    <g transform="translate(122, 16)">
      <rect width="110" height="60" rx="10" fill="#111420" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="10" y="24" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Surface Main</text>
      <text x="10" y="44" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">#111420</text>
    </g>

    <!-- Surface Elevated -->
    <g transform="translate(244, 16)">
      <rect width="110" height="60" rx="10" fill="#181c2e" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="10" y="24" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Elevated Sheet</text>
      <text x="10" y="44" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">#181C2E</text>
    </g>

    <!-- Surface Card -->
    <g transform="translate(366, 16)">
      <rect width="110" height="60" rx="10" fill="#141824" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="10" y="24" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Card Glass</text>
      <text x="10" y="44" font-family="'Geist Mono', monospace" font-size="10" fill="#64748b">#141824</text>
    </g>
  </g>

  <!-- 2. Accent Colors -->
  <g transform="translate(30, 220)">
    <text x="0" y="0" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">ACCENT &amp; HIGHLIGHT SYSTEM</text>

    <!-- Laser Indigo -->
    <g transform="translate(0, 16)">
      <rect width="110" height="60" rx="10" fill="#4f6bff"/>
      <text x="10" y="24" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Laser Indigo</text>
      <text x="10" y="44" font-family="'Geist Mono', monospace" font-size="10" fill="#ffffff" opacity="0.8">#4F6BFF</text>
    </g>

    <!-- Neon Cyan -->
    <g transform="translate(122, 16)">
      <rect width="110" height="60" rx="10" fill="#06b6d4"/>
      <text x="10" y="24" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Neon Cyan</text>
      <text x="10" y="44" font-family="'Geist Mono', monospace" font-size="10" fill="#ffffff" opacity="0.8">#06B6D4</text>
    </g>

    <!-- Video Blue -->
    <g transform="translate(244, 16)">
      <rect width="110" height="60" rx="10" fill="#2563eb"/>
      <text x="10" y="24" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Video Track</text>
      <text x="10" y="44" font-family="'Geist Mono', monospace" font-size="10" fill="#ffffff" opacity="0.8">#2563EB</text>
    </g>

    <!-- Hot Coral -->
    <g transform="translate(366, 16)">
      <rect width="110" height="60" rx="10" fill="#ef4444"/>
      <text x="10" y="24" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Playhead Red</text>
      <text x="10" y="44" font-family="'Geist Mono', monospace" font-size="10" fill="#ffffff" opacity="0.8">#EF4444</text>
    </g>
  </g>

  <!-- 3. Typography Hierarchy -->
  <g transform="translate(30, 330)">
    <text x="0" y="0" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">TYPOGRAPHY HIERARCHY</text>

    <g transform="translate(0, 20)">
      <text x="0" y="22" font-family="Impact, sans-serif" font-size="26" font-weight="900" fill="#ffffff" stroke="#000000" stroke-width="2" paint-order="stroke fill">MEME DISPLAY HEADLINE (Impact 26px)</text>
      <text x="0" y="54" font-family="-apple-system, Inter, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Section Title &amp; Primary UI (Inter Bold 18px)</text>
      <text x="0" y="80" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Interactive Control &amp; Body Text (Inter Medium 14px)</text>
      <text x="0" y="106" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#4f6bff">00:03.42 / 00:07.80 • Timecodes &amp; Formats (Geist Mono 12px)</text>
    </g>
  </g>

  <!-- 4. Reusable UI Components -->
  <g transform="translate(30, 480)">
    <text x="0" y="0" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">REUSABLE PENPOT COMPONENTS</text>

    <!-- Component Row 1: Buttons -->
    <g transform="translate(0, 20)">
      <!-- Primary Button -->
      <rect width="140" height="40" rx="10" fill="url(#token-indigo)"/>
      <text x="70" y="25" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="13" fill="#ffffff">Primary Action</text>

      <!-- Ghost Button -->
      <rect x="156" width="140" height="40" rx="10" fill="#141824" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="226" y="25" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-weight="500" font-size="13" fill="#cbd5e1">Ghost Button</text>

      <!-- Pill Dropdown -->
      <rect x="312" width="120" height="40" rx="20" fill="#141824" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="372" y="25" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="12" fill="#ffffff">1:1 Square ▾</text>
    </g>

    <!-- Component Row 2: Badges and Tags -->
    <g transform="translate(0, 76)">
      <!-- Format Tag -->
      <rect width="64" height="22" rx="5" fill="#000000" opacity="0.8"/>
      <text x="32" y="15" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#ffffff" font-weight="600">HD • 1:1</text>

      <!-- Video Duration Tag -->
      <rect x="76" width="60" height="22" rx="5" fill="#000000" opacity="0.8"/>
      <text x="106" y="15" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#38bdf8" font-weight="600">🎬 4.2s</text>

      <!-- Metric Hotness -->
      <rect x="148" width="76" height="22" rx="5" fill="#14281e" stroke="#22c55e" stroke-width="1"/>
      <text x="186" y="15" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#22c55e" font-weight="700">99% HOT</text>

      <!-- Command Badge -->
      <rect x="236" width="36" height="22" rx="5" fill="#1c2237" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="254" y="15" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#94a3b8">⌘K</text>
    </g>

    <!-- Component Row 3: Dock Navigation Item -->
    <g transform="translate(0, 116)">
      <rect width="240" height="52" rx="26" fill="#111422" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="6" y="6" width="94" height="40" rx="20" fill="url(#token-indigo)"/>
      <text x="53" y="30" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="12" fill="#ffffff">Active Item</text>
      <text x="160" y="30" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-weight="500" font-size="12" fill="#94a3b8">Default Item</text>
    </g>
  </g>
</svg>
