<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGradTweet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="avatarGradTweet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="cardShadowTweet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="800" height="800" fill="url(#bgGradTweet)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="400" r="280" fill="#1d9bf0" opacity="0.06" filter="blur(60px)" />

  <!-- Tweet Card Container -->
  <g transform="translate(60, 180)" filter="url(#cardShadowTweet)">
    <!-- Card Frame -->
    <rect width="680" height="440" rx="24" fill="#000000" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

    <!-- Header Section -->
    <g transform="translate(36, 36)">
      <!-- Avatar -->
      <circle cx="28" cy="28" r="28" fill="url(#avatarGradTweet)" />
      <!-- Stylized silhouette icon inside avatar -->
      <path d="M 28 20 A 8 8 0 1 0 28 36 A 8 8 0 1 0 28 20 Z M 16 48 C 16 41 21 38 28 38 C 35 38 40 41 40 48 Z" fill="#ffffff" opacity="0.9" />

      <!-- User Names -->
      <text x="72" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Elon Musk</text>
      
      <!-- Verified Badge -->
      <g transform="translate(182, 9)">
        <circle cx="10" cy="10" r="9" fill="#1d9bf0" />
        <path d="M 6.5 10 L 9 12.5 L 14 7.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Handle -->
      <text x="72" y="47" fill="#71767b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">@elonmusk</text>

      <!-- 𝕏 Logo Top Right -->
      <g transform="translate(570, 6)">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" fill="#ffffff" />
      </g>
    </g>

    <!-- Post Text Content -->
    <g transform="translate(36, 126)">
      <text fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" line-height="1.4">
        <tspan x="0" y="20">thinking about deleting the database</tspan>
        <tspan x="0" y="56">and moving to the woods.</tspan>
      </text>
    </g>

    <!-- Timestamp & Views -->
    <g transform="translate(36, 252)">
      <text fill="#71767b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
        10:42 PM · Oct 8, 2026 · <tspan fill="#ffffff" font-weight="600">18.2M</tspan> Views
      </text>
    </g>

    <!-- Divider Line -->
    <line x1="36" y1="284" x2="644" y2="284" stroke="#2f3336" stroke-width="1" />

    <!-- Metrics Action Bar -->
    <g transform="translate(36, 330)">
      <!-- Replies -->
      <g transform="translate(10, 0)">
        <path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-1.604.89 1.022 3.06c.203.61-.341 1.2-1.004.99l-4.516-1.42c-.443-.14-.908-.18-1.373-.18h-2.023c-4.421 0-8.006-3.58-8.006-8z" fill="none" stroke="#71767b" stroke-width="1.8" />
        <text x="32" y="15" fill="#71767b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">14.2K</text>
      </g>

      <!-- Retweets -->
      <g transform="translate(160, 0)">
        <path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.9 2 2 2H16v2H7.5C5.57 20 4 18.43 4 16.5V7.55L1.932 9.48.568 8.02 5 3.88zm15 16.24l-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.9-2-2-2H8V4h8.5C18.43 4 20 5.57 20 7.5v8.95l2.068-1.93 1.364 1.46-4.432 4.14z" fill="#71767b" />
        <text x="32" y="15" fill="#71767b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">62.8K</text>
      </g>

      <!-- Likes -->
      <g transform="translate(310, 0)">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#f43f5e" />
        <text x="30" y="15" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">420.5K</text>
      </g>

      <!-- Bookmark / Views -->
      <g transform="translate(470, 0)">
        <path d="M18 2H6c-1.1 0-2 .9-2 2v16l8-4 8 4V4c0-1.1-.9-2-2-2zm0 14.55l-6-3-6 3V4h12v12.55z" fill="#71767b" />
        <text x="28" y="15" fill="#71767b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">18.2K</text>
      </g>
    </g>

    <!-- Bottom Category Tag Accent -->
    <rect x="36" y="416" width="608" height="3" rx="1.5" fill="url(#avatarGradTweet)" opacity="0.6" />
  </g>
</svg>
