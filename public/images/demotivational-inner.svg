<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="screenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Room Wall -->
  <rect x="0" y="0" width="800" height="560" fill="url(#bgGrad)" />

  <!-- Window with moon -->
  <rect x="620" y="40" width="120" height="150" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="4" />
  <circle cx="680" cy="90" r="28" fill="#fef08a" opacity="0.9" />
  <circle cx="692" cy="85" r="26" fill="#0f172a" />
  <!-- Stars -->
  <circle cx="645" cy="65" r="2" fill="#ffffff" />
  <circle cx="655" cy="130" r="1.5" fill="#ffffff" />
  <circle cx="715" cy="140" r="2" fill="#ffffff" />

  <!-- Wooden Desk Surface -->
  <rect x="0" y="380" width="800" height="180" fill="url(#deskGrad)" />
  <line x1="0" y1="380" x2="800" y2="380" stroke="#a16207" stroke-width="3" opacity="0.6" />

  <!-- Coffee Mug -->
  <rect x="110" y="325" width="46" height="58" rx="6" fill="#ef4444" />
  <path d="M156 340 C175 340 175 365 156 365" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
  <ellipse cx="133" cy="328" rx="19" ry="6" fill="#78350f" />
  <!-- Steam from coffee -->
  <path d="M126 312 Q122 300 128 290 Q134 280 130 270" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M138 315 Q144 305 138 295 Q132 285 138 275" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round" />

  <!-- Laptop Open -->
  <!-- Screen Glow -->
  <rect x="250" y="160" width="300" height="200" rx="10" fill="url(#screenGrad)" opacity="0.15" filter="url(#screenGlow)" />
  <!-- Screen Back / Bezel -->
  <rect x="260" y="150" width="280" height="180" rx="8" fill="#1e293b" stroke="#475569" stroke-width="4" />
  <!-- Display with Code / Work -->
  <rect x="272" y="162" width="256" height="156" rx="4" fill="#0f172a" />
  <rect x="284" y="176" width="90" height="7" rx="3" fill="#38bdf8" />
  <rect x="284" y="192" width="150" height="6" rx="3" fill="#a855f7" />
  <rect x="300" y="206" width="180" height="6" rx="3" fill="#4ade80" />
  <rect x="300" y="220" width="120" height="6" rx="3" fill="#f43f5e" />
  <rect x="320" y="234" width="140" height="6" rx="3" fill="#facc15" />
  <rect x="284" y="248" width="60" height="6" rx="3" fill="#38bdf8" />
  <rect x="284" y="266" width="110" height="6" rx="3" fill="#94a3b8" />

  <!-- Laptop Base / Keyboard -->
  <path d="M220 330 L580 330 L630 405 L170 405 Z" fill="#334155" stroke="#475569" stroke-width="2" />
  <rect x="240" y="338" width="320" height="42" rx="4" fill="#1e293b" opacity="0.8" />

  <!-- Sleeping Cat on Keyboard -->
  <!-- Cat Body -->
  <ellipse cx="400" cy="370" rx="95" ry="50" fill="url(#catGrad)" />
  <!-- Cat Fur Stripes -->
  <path d="M370 335 Q375 350 372 365" stroke="#c2410c" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M400 330 Q405 348 402 368" stroke="#c2410c" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M430 335 Q435 350 432 365" stroke="#c2410c" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Cat Head -->
  <circle cx="325" cy="375" r="42" fill="url(#catGrad)" />
  <!-- Cat Ears -->
  <polygon points="300,345 285,310 320,335" fill="#ea580c" />
  <polygon points="296,342 290,320 312,335" fill="#fecdd3" />
  <polygon points="345,345 365,312 330,335" fill="#ea580c" />
  <polygon points="342,342 355,322 335,335" fill="#fecdd3" />
  <!-- Cat Sleeping Eyes (Curved arcs) -->
  <path d="M302 375 Q310 384 318 375" fill="none" stroke="#7c2d12" stroke-width="3.5" stroke-linecap="round" />
  <path d="M326 375 Q334 384 342 375" fill="none" stroke="#7c2d12" stroke-width="3.5" stroke-linecap="round" />
  <!-- Cat Nose & Mouth -->
  <polygon points="322,385 328,385 325,389" fill="#f43f5e" />
  <path d="M325 389 Q320 395 315 392" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />
  <path d="M325 389 Q330 395 335 392" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" />
  <!-- Whiskers -->
  <line x1="285" y1="380" x2="305" y2="384" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" />
  <line x1="282" y1="390" x2="305" y2="390" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" />
  <line x1="345" y1="384" x2="365" y2="380" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" />
  <line x1="345" y1="390" x2="368" y2="390" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" />

  <!-- Cat Paws -->
  <ellipse cx="320" cy="410" rx="18" ry="12" fill="#fed7aa" />
  <ellipse cx="355" cy="412" rx="16" ry="11" fill="#fed7aa" />

  <!-- Cat Tail curled -->
  <path d="M490 375 C530 365 545 400 520 415 C500 425 470 410 460 395" fill="none" stroke="url(#catGrad)" stroke-width="24" stroke-linecap="round" />

  <!-- Floating Zzz's -->
  <text x="270" y="320" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#38bdf8" opacity="0.9">Z</text>
  <text x="250" y="290" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#a855f7" opacity="0.85">Z</text>
  <text x="230" y="250" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#f43f5e" opacity="0.8">z</text>
</svg>
