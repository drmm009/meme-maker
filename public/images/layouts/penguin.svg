<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <!-- Choose Canvas Layout: a puzzled penguin, drawn for the app. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9ff"/>
      <stop offset="1" stop-color="#6fa8e6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="70" cy="80" r="5"/>
    <circle cx="330" cy="60" r="4"/>
    <circle cx="300" cy="130" r="3"/>
    <circle cx="96" cy="160" r="3"/>
  </g>
  <ellipse cx="200" cy="420" rx="240" ry="70" fill="#eef7ff"/>
  <!-- body -->
  <ellipse cx="200" cy="268" rx="112" ry="128" fill="#1f2a3a"/>
  <ellipse cx="200" cy="292" rx="78" ry="98" fill="#f8fbff"/>
  <!-- flippers -->
  <path d="M92 250 C64 288 70 330 98 340 C100 300 108 272 116 258 Z" fill="#1f2a3a"/>
  <path d="M308 250 C336 288 330 330 302 340 C300 300 292 272 284 258 Z" fill="#1f2a3a"/>
  <!-- face -->
  <path d="M120 186 C130 150 160 132 200 132 C240 132 270 150 280 186 C260 210 232 214 200 206 C168 214 140 210 120 186 Z" fill="#f8fbff"/>
  <circle cx="168" cy="184" r="15" fill="#1f2a3a"/>
  <circle cx="232" cy="184" r="15" fill="#1f2a3a"/>
  <circle cx="172" cy="179" r="5" fill="#fff"/>
  <circle cx="236" cy="179" r="5" fill="#fff"/>
  <!-- one eyebrow raised -->
  <path d="M150 158 L184 164" stroke="#1f2a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M216 156 C226 146 240 144 252 150" stroke="#1f2a3a" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- beak -->
  <path d="M176 206 L224 206 L200 232 Z" fill="#ffa53a"/>
  <path d="M182 206 L218 206 L200 216 Z" fill="#ffc46e"/>
  <ellipse cx="146" cy="210" rx="13" ry="7" fill="#ff9aa8" opacity="0.5"/>
  <ellipse cx="254" cy="210" rx="13" ry="7" fill="#ff9aa8" opacity="0.5"/>
  <!-- feet -->
  <ellipse cx="166" cy="392" rx="26" ry="10" fill="#ffa53a"/>
  <ellipse cx="234" cy="392" rx="26" ry="10" fill="#ffa53a"/>
</svg>
