<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <!-- Choose Canvas Layout: a smug penguin, flippers crossed, one brow up, in the style of the shiba
       and the tabby (cream ground, thick brown outlines, side-eye). -->
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4254"/>
      <stop offset="1" stop-color="#262c3a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#f8e3bb"/>
  <!-- huff marks -->
  <g stroke="#3a2315" stroke-width="7" stroke-linecap="round">
    <path d="M90 110 L108 132"/>
    <path d="M70 136 L96 148"/>
  </g>
  <g stroke="#3a2315" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- body -->
    <path d="M200 74 C278 74 316 150 318 232 C320 320 290 400 290 400 H110 C110 400 80 320 82 232 C84 150 122 74 200 74 Z" fill="url(#coat)"/>
    <!-- white face and belly -->
    <path d="M200 120 C246 120 272 148 276 184 C280 214 262 236 236 240 C258 262 268 300 266 344 C264 380 256 400 256 400 H144 C144 400 136 380 134 344 C132 300 142 262 164 240 C138 236 120 214 124 184 C128 148 154 120 200 120 Z" fill="#fbf6ee"/>
    <!-- feet -->
    <path d="M140 392 C140 378 176 378 180 392 Z" fill="#ffa23a"/>
    <path d="M220 392 C224 378 260 378 260 392 Z" fill="#ffa23a"/>
    <!-- crossed flippers over the belly -->
    <path d="M96 236 C120 286 190 300 266 282 C276 280 278 296 268 300 C196 324 116 308 88 262 Z" fill="url(#coat)"/>
    <path d="M304 236 C280 286 210 300 134 282 C124 280 122 296 132 300 C204 324 284 308 312 262 Z" fill="url(#coat)"/>
  </g>
  <g stroke="#3a2315" stroke-linecap="round">
    <!-- side-eye, one brow up -->
    <ellipse cx="166" cy="176" rx="20" ry="14" fill="#ffffff" stroke-width="5"/>
    <ellipse cx="236" cy="176" rx="20" ry="14" fill="#ffffff" stroke-width="5"/>
    <circle cx="178" cy="178" r="9" fill="#20140c" stroke="none"/>
    <circle cx="248" cy="178" r="9" fill="#20140c" stroke="none"/>
    <path d="M145 171 C156 164 176 164 187 170" stroke-width="6" fill="none"/>
    <path d="M215 170 C226 164 246 164 257 171" stroke-width="6" fill="none"/>
    <path d="M216 148 C228 138 246 138 258 146" stroke-width="6" fill="none"/>
    <path d="M146 154 L184 158" stroke-width="6" fill="none"/>
    <!-- beak with a smirk under it -->
    <path d="M182 196 L218 196 L200 216 Z" fill="#ffa23a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M188 226 C198 232 212 230 220 222" stroke-width="5" fill="none"/>
  </g>
  <ellipse cx="146" cy="210" rx="13" ry="7" fill="#ff8f9c" opacity="0.45"/>
  <ellipse cx="256" cy="210" rx="13" ry="7" fill="#ff8f9c" opacity="0.45"/>
</svg>
