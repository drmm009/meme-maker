<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <!-- Choose Canvas Layout's Caption layouts: a side-eyeing shiba, drawn for the app. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="1" stop-color="#f6b45e"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e98d3a"/>
      <stop offset="1" stop-color="#d4742a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- body -->
  <path d="M98 400 C104 318 148 286 200 286 C252 286 296 318 302 400 Z" fill="url(#fur)"/>
  <path d="M158 400 C162 340 178 318 200 318 C222 318 238 340 242 400 Z" fill="#fff6e6"/>
  <!-- ears -->
  <path d="M120 170 L134 78 L192 132 Z" fill="#d4742a"/>
  <path d="M138 154 L144 104 L178 136 Z" fill="#ffe3c2"/>
  <path d="M280 170 L266 78 L208 132 Z" fill="#d4742a"/>
  <path d="M262 154 L256 104 L222 136 Z" fill="#ffe3c2"/>
  <!-- head -->
  <ellipse cx="200" cy="196" rx="104" ry="92" fill="url(#fur)"/>
  <!-- cream cheeks and muzzle -->
  <path d="M108 214 C118 272 160 294 200 294 C240 294 282 272 292 214 C268 236 236 240 200 240 C164 240 132 236 108 214 Z" fill="#fff6e6"/>
  <ellipse cx="200" cy="240" rx="52" ry="38" fill="#fff6e6"/>
  <!-- eyebrow spots -->
  <ellipse cx="160" cy="160" rx="13" ry="8" fill="#fff1d6"/>
  <ellipse cx="240" cy="160" rx="13" ry="8" fill="#fff1d6"/>
  <!-- eyes, looking aside -->
  <ellipse cx="160" cy="190" rx="20" ry="15" fill="#fff"/>
  <ellipse cx="240" cy="190" rx="20" ry="15" fill="#fff"/>
  <circle cx="172" cy="192" r="10" fill="#2b1a10"/>
  <circle cx="252" cy="192" r="10" fill="#2b1a10"/>
  <circle cx="175" cy="188" r="3" fill="#fff"/>
  <circle cx="255" cy="188" r="3" fill="#fff"/>
  <path d="M140 182 C150 176 170 176 180 180" stroke="#b35c1c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M220 180 C230 176 250 176 260 182" stroke="#b35c1c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- nose and mouth -->
  <ellipse cx="200" cy="226" rx="17" ry="12" fill="#2b1a10"/>
  <ellipse cx="195" cy="222" rx="5" ry="3" fill="#6b5446"/>
  <path d="M200 238 L200 250 M200 250 C192 262 178 262 172 254 M200 250 C208 262 222 262 228 254" stroke="#2b1a10" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- blush -->
  <ellipse cx="128" cy="232" rx="14" ry="8" fill="#ff9b8a" opacity="0.45"/>
  <ellipse cx="272" cy="232" rx="14" ry="8" fill="#ff9b8a" opacity="0.45"/>
</svg>
