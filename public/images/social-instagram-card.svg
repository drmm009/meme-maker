<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGradInsta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4f5" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="igStoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="igMediaGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="50%" stop-color="#ede9fe" />
      <stop offset="100%" stop-color="#fae8ff" />
    </linearGradient>
    <filter id="cardShadowInsta" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="800" height="800" fill="url(#bgGradInsta)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="400" r="280" fill="#f43f5e" opacity="0.08" filter="blur(60px)" />

  <!-- Instagram Card Container -->
  <g transform="translate(65, 80)" filter="url(#cardShadowInsta)">
    <!-- Card Frame -->
    <rect width="670" height="640" rx="24" fill="#ffffff" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1.5" />

    <!-- Header Section -->
    <g transform="translate(30, 24)">
      <!-- Story Ring -->
      <circle cx="26" cy="26" r="24" fill="none" stroke="url(#igStoryGrad)" stroke-width="2.5" />
      <circle cx="26" cy="26" r="20" fill="#f1f5f9" />
      <!-- Silhouette avatar -->
      <path d="M 26 19 A 6 6 0 1 0 26 31 A 6 6 0 1 0 26 19 Z M 17 40 C 17 34 21 32 26 32 C 31 32 35 34 35 40 Z" fill="#64748b" opacity="0.9" />

      <!-- User Names -->
      <text x="64" y="24" fill="#262626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">inc42.media</text>

      <!-- Verified Badge -->
      <g transform="translate(178, 11)">
        <circle cx="8" cy="8" r="8" fill="#38bdf8" />
        <path d="M 5 8 L 7.5 10.5 L 11.5 6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Subtitle -->
      <text x="64" y="44" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Suggested for you</text>

      <!-- 3 Dots More Menu -->
      <g transform="translate(580, 20)">
        <circle cx="0" cy="6" r="2.5" fill="#262626" />
        <circle cx="10" cy="6" r="2.5" fill="#262626" />
        <circle cx="20" cy="6" r="2.5" fill="#262626" />
      </g>
    </g>

    <!-- Post Media Photo Area -->
    <g transform="translate(30, 92)">
      <rect width="610" height="310" rx="14" fill="url(#igMediaGradLight)" stroke="rgba(0, 0, 0, 0.05)" />
      
      <!-- Meme Content Graphic inside Post -->
      <circle cx="305" cy="135" r="54" fill="#6366f1" opacity="0.15" />
      <text x="305" y="142" text-anchor="middle" fill="#4338ca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">📸 MEME MEDIA</text>
      <text x="305" y="174" text-anchor="middle" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">Tap in editor to replace with your photo or video</text>
    </g>

    <!-- Action Icons Row -->
    <g transform="translate(30, 428)">
      <!-- Heart -->
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#f43f5e" transform="scale(1.2)" />

      <!-- Comment Bubble -->
      <g transform="translate(56, 2) scale(1.15)">
        <path d="M20.656 17.008a9.993 9.993 0 10-3.59 3.615L22 22z" fill="none" stroke="#262626" stroke-width="2" stroke-linejoin="round" />
      </g>

      <!-- Share Paperplane -->
      <g transform="translate(110, 2) scale(1.15)">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" fill="none" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Bookmark (Right) -->
      <g transform="translate(585, 2) scale(1.15)">
        <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" fill="none" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Likes Count & Caption Details -->
    <g transform="translate(30, 482)">
      <text fill="#262626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">1,583 likes</text>
      
      <text y="28" fill="#262626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15">
        <tspan font-weight="700">inc42.media </tspan>
        <tspan fill="#475569">Remember Tanmay Bhat from the AIB... </tspan>
        <tspan fill="#737373">more</tspan>
      </text>

      <text y="56" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">View all 15 comments</text>
      <text y="80" fill="#8e8e8e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">28 SEPTEMBER</text>
    </g>

    <!-- Bottom Gradient Accent -->
    <rect x="30" y="618" width="610" height="3" rx="1.5" fill="url(#igStoryGrad)" opacity="0.75" />
  </g>
</svg>
