<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGradWA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081015" />
      <stop offset="50%" stop-color="#0b141a" />
      <stop offset="100%" stop-color="#050a0d" />
    </linearGradient>
    <filter id="cardShadowWA" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <pattern id="waDoodles" width="180" height="180" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.045">
        <path d="M15 15h20v14H24l-6 5v-5h-3z"/>
        <circle cx="110" cy="30" r="8"/>
        <path d="M110 26v4l3 2"/>
        <path d="M150 40c0-4 4-8 8-8s8 4 8 8c0 8-16 16-16 16s-16-8-16-16c0-4 4-8 8-8s8 4 8 8z"/>
        <circle cx="55" cy="75" r="3" fill="#fff"/>
        <path d="M58 75V62h10v10"/>
        <circle cx="68" cy="72" r="3" fill="#fff"/>
        <rect x="130" y="100" width="16" height="12" rx="2"/>
        <circle cx="138" cy="106" r="3"/>
        <circle cx="40" cy="130" r="9"/>
        <circle cx="37" cy="128" r="1" fill="#fff"/>
        <circle cx="43" cy="128" r="1" fill="#fff"/>
        <path d="M37 133a4 4 0 0 0 6 0"/>
        <path d="M95 145l2 4 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1z"/>
        <path d="M150 155l3 3 6-7m-4 4l3 3 6-7"/>
      </g>
    </pattern>
    <clipPath id="cardClipWA">
      <rect width="680" height="640" rx="22" />
    </clipPath>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="800" height="800" fill="url(#bgGradWA)" />

  <!-- Subtle WhatsApp Green Ambient Glow -->
  <circle cx="400" cy="400" r="300" fill="#22c55e" opacity="0.035" filter="blur(70px)" />

  <!-- WhatsApp Chat Container -->
  <g transform="translate(60, 80)" filter="url(#cardShadowWA)">
    <!-- Base Card Container with Clip -->
    <g clip-path="url(#cardClipWA)">
      <!-- Card Wallpaper -->
      <rect width="680" height="640" fill="#0b141a" />
      <rect width="680" height="640" fill="url(#waDoodles)" />

      <!-- Top Header Bar -->
      <g>
        <rect width="680" height="68" fill="#121b22" />
        <line x1="0" y1="68" x2="680" y2="68" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        
        <!-- Back Arrow < -->
        <path d="M 28 34 L 38 24 M 28 34 L 38 44" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Avatar -->
        <circle cx="68" cy="34" r="20" fill="#202c33" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="68" y="40" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">A</text>

        <!-- Contact Name & Status -->
        <text x="100" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">+91 81210 03003</text>
        <text x="100" y="48" fill="#8696a0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">last seen yesterday at 6:43 PM</text>

        <!-- Outline Phone Icon on Right -->
        <path d="M640 40a12 12 0 0 1-5.3-5.3l1.8-1.8a1 1 0 0 0 .2-1 9 9 0 0 0-2-3 1 1 0 0 0-1 0l-2.8 1a1 1 0 0 0-.6.8c0 7 6 13 13 13a1 1 0 0 0 .8-.6l1-2.8a1 1 0 0 0 0-1 9 9 0 0 0-3-2 1 1 0 0 0-1 .2l-1.8 1.8z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Centered Date Badge ("Yesterday") -->
      <g transform="translate(295, 84)">
        <rect width="90" height="24" rx="7" fill="#182229" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="45" y="16" text-anchor="middle" fill="#8696a0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Yesterday</text>
      </g>

      <!-- Message 1 (Sent - Green) -->
      <g transform="translate(420, 122)">
        <path d="M 8 0 L 232 0 L 239 0 C 234 3 232 7 232 11 L 232 46 C 232 50 228 54 224 54 L 8 54 C 4 54 0 50 0 46 L 0 8 C 0 4 4 0 8 0 Z" fill="#005c4b" />
        <text x="14" y="24" fill="#e9edef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Hi, I need some help.</text>
        <text x="180" y="44" fill="rgba(255,255,255,0.6)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">12:28 PM</text>
        <path d="M 208 40 l 3 3 l 7 -7 m -3 3 l 3 3 l 7 -7" fill="none" stroke="#53bdeb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Message 2 (Received - Slate) -->
      <g transform="translate(24, 190)">
        <path d="M -7 0 L 460 0 C 464 0 468 4 468 8 L 468 90 C 468 94 464 98 460 98 L 8 98 C 4 98 0 94 0 90 L 0 11 C 0 7 -2 3 -7 0 Z" fill="#202c33" />
        <text fill="#e9edef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">
          <tspan x="14" y="24">Hello. Are you looking for advertising</tspan>
          <tspan x="14" y="46">in newspaper. Please let us know what kind</tspan>
          <tspan x="14" y="68">of ad you are looking to advertise.</tspan>
        </text>
        <text x="410" y="88" fill="#8696a0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">12:31 PM</text>
      </g>

      <!-- Message 3 (Sent - Consecutive Green) -->
      <g transform="translate(540, 302)">
        <rect width="112" height="42" rx="8" fill="#005c4b" />
        <text x="14" y="26" fill="#e9edef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Yes</text>
        <text x="60" y="32" fill="rgba(255,255,255,0.6)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">12:31</text>
        <path d="M 88 28 l 2.5 2.5 l 5.5 -5.5 m -2.5 2.5 l 2.5 2.5 l 5.5 -5.5" fill="none" stroke="#53bdeb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Message 4 (Sent - Consecutive Green) -->
      <g transform="translate(385, 350)">
        <rect width="267" height="44" rx="8" fill="#005c4b" />
        <text x="14" y="27" fill="#e9edef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">In English and Gujarati</text>
        <text x="210" y="33" fill="rgba(255,255,255,0.6)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">12:31</text>
        <path d="M 242 29 l 2.5 2.5 l 5.5 -5.5 m -2.5 2.5 l 2.5 2.5 l 5.5 -5.5" fill="none" stroke="#53bdeb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Message 5 (Received - Slate) -->
      <g transform="translate(24, 410)">
        <path d="M -7 0 L 460 0 C 464 0 468 4 468 8 L 468 76 C 468 80 464 84 460 84 L 8 84 C 4 84 0 80 0 76 L 0 11 C 0 7 -2 3 -7 0 Z" fill="#202c33" />
        <text fill="#e9edef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">
          <tspan x="14" y="24">We request you to please share the matter</tspan>
          <tspan x="14" y="46">along with the newspaper name and city.</tspan>
        </text>
        <text x="410" y="72" fill="#8696a0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">12:16 PM</text>
      </g>

      <!-- Floating Scroll Button -->
      <g transform="translate(630, 520)">
        <circle cx="16" cy="16" r="15" fill="#202c33" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <path d="M 11 14 L 16 19 L 21 14" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Bottom Chat Input Bar -->
      <g transform="translate(0, 580)">
        <rect width="680" height="60" fill="#0b141a" />
        <line x1="0" y1="0" x2="680" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

        <!-- Plus icon -->
        <text x="24" y="36" fill="#8696a0" font-family="-apple-system, sans-serif" font-size="26" text-anchor="middle">+</text>

        <!-- Rounded Input Capsule -->
        <rect x="46" y="10" width="520" height="40" rx="20" fill="#202c33" />
        <text x="64" y="35" fill="#8696a0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Message</text>
        <rect x="536" y="22" width="16" height="16" fill="none" stroke="#8696a0" stroke-width="1.5" rx="2" />

        <!-- Camera Icon -->
        <rect x="584" y="24" width="18" height="14" rx="2" fill="none" stroke="#8696a0" stroke-width="1.6" />

        <!-- Mic Circle -->
        <circle cx="642" cy="30" r="18" fill="#202c33" />
        <text x="642" y="35" text-anchor="middle" fill="#ffffff" font-size="15">🎤</text>
      </g>
    </g>

    <!-- Card Outer Border -->
    <rect width="680" height="640" rx="22" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  </g>
</svg>
