<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Explore's preview of the Tweet / X post card template: a dark post on a deep blue glow. Drawn
       for the app; no brand marks. -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.15" r="1">
      <stop offset="0" stop-color="#1f4fa3"/>
      <stop offset="0.6" stop-color="#0d1b3d"/>
      <stop offset="1" stop-color="#070b18"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- the post, tilted a touch -->
  <g transform="rotate(-4 200 200)">
    <rect x="44" y="96" width="312" height="208" rx="22" fill="#000000" stroke="#2f3336" stroke-width="2"/>
    <!-- avatar, name, verified tick, handle -->
    <circle cx="86" cy="138" r="20" fill="#f4b26b"/>
    <circle cx="86" cy="132" r="8" fill="#7a4b24"/>
    <path d="M72 150 C76 140 96 140 100 150" fill="#7a4b24"/>
    <rect x="116" y="124" width="92" height="12" rx="6" fill="#e7e9ea"/>
    <circle cx="220" cy="130" r="8" fill="#1d9bf0"/>
    <path d="M216 130 L219 133 L225 127" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="116" y="144" width="70" height="9" rx="4.5" fill="#71767b"/>
    <!-- the post's words -->
    <rect x="66" y="178" width="268" height="12" rx="6" fill="#e7e9ea"/>
    <rect x="66" y="200" width="232" height="12" rx="6" fill="#e7e9ea"/>
    <rect x="66" y="222" width="150" height="12" rx="6" fill="#e7e9ea"/>
    <!-- metrics row -->
    <g fill="none" stroke="#71767b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 270 h16 a6 6 0 0 1 6 6 v6 a6 6 0 0 1 -6 6 h-8 l-6 5 v-5 a6 6 0 0 1 -2 -4 z"/>
      <path d="M146 272 l8 -6 l8 6 M154 266 v20 M180 286 l-8 6 l-8 -6"/>
      <path d="M238 281 c-6 -6 -14 -2 -12 4 c2 6 12 10 12 10 s10 -4 12 -10 c2 -6 -6 -10 -12 -4 z" fill="#f91880" stroke="#f91880"/>
      <path d="M310 290 v-10 M318 290 v-18 M326 290 v-6"/>
    </g>
    <rect x="252" y="278" width="34" height="9" rx="4.5" fill="#f91880"/>
  </g>
  <!-- a little glow of likes -->
  <g fill="#f91880" opacity="0.9">
    <path d="M330 84 c-5 -5 -12 -2 -10 3 c1.5 5 10 9 10 9 s8.5 -4 10 -9 c2 -5 -5 -8 -10 -3 z"/>
    <path d="M356 112 c-3 -3 -8 -1 -7 2 c1 3 7 6 7 6 s6 -3 7 -6 c1 -3 -4 -5 -7 -2 z"/>
  </g>
</svg>
