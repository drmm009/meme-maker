<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Explore's preview of the Instagram feed post card template: a post on a warm pink-to-purple
       glow. Drawn for the app; no brand marks. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f9a43c"/>
      <stop offset="0.45" stop-color="#e5376b"/>
      <stop offset="1" stop-color="#7b2ff2"/>
    </linearGradient>
    <linearGradient id="pic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd29a"/>
      <stop offset="1" stop-color="#ff8fa6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f9a43c"/>
      <stop offset="1" stop-color="#d6249f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g transform="rotate(4 200 200)">
    <rect x="86" y="52" width="228" height="300" rx="20" fill="#ffffff"/>
    <!-- avatar in its ring, name, dots -->
    <circle cx="114" cy="80" r="14" fill="none" stroke="url(#ring)" stroke-width="3"/>
    <circle cx="114" cy="80" r="9.5" fill="#f4b26b"/>
    <rect x="136" y="74" width="74" height="10" rx="5" fill="#262626"/>
    <g fill="#262626"><circle cx="284" cy="80" r="2.6"/><circle cx="292" cy="80" r="2.6"/><circle cx="276" cy="80" r="2.6"/></g>
    <!-- the photo: a sun over hills -->
    <rect x="86" y="104" width="228" height="176" fill="url(#pic)"/>
    <circle cx="246" cy="164" r="26" fill="#fff4d8"/>
    <path d="M86 254 C130 214 170 222 206 240 C240 256 276 226 314 236 V280 H86 Z" fill="#e5376b" opacity="0.75"/>
    <!-- heart, comment, share; bookmark -->
    <path d="M112 302 c-7 -7 -17 -2 -14 5 c2 7 14 12 14 12 s12 -5 14 -12 c3 -7 -7 -12 -14 -5 z" fill="#ed4956"/>
    <path d="M142 296 a11 11 0 1 1 4 18 l-6 2 l2 -6 a11 11 0 0 1 0 -14 z" fill="none" stroke="#262626" stroke-width="3" stroke-linejoin="round"/>
    <path d="M172 296 L196 306 L172 316 L176 306 Z" fill="none" stroke="#262626" stroke-width="3" stroke-linejoin="round"/>
    <path d="M286 296 h14 v22 l-7 -6 l-7 6 z" fill="none" stroke="#262626" stroke-width="3" stroke-linejoin="round"/>
    <rect x="98" y="328" width="96" height="9" rx="4.5" fill="#262626"/>
  </g>
</svg>
